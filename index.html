<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GuitarTuner">
  <meta name="application-version" content="11.0.0">
  <title>GuitarTuner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0f;
      --panel: #19191c;
      --panel-2: #222226;
      --text: #f5f5f7;
      --muted: #98989f;
      --line: #35353a;
      --accent: #0a84ff;
      --ok: #30d158;
      --warn: #ff9f0a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .shell {
      height: 100dvh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding:
        max(8px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% -10%, #242429 0, var(--bg) 48%);
    }

    .app {
      width: min(100%, 500px);
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .topbar {
      min-height: 42px;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
    }

    .brand-lockup {
      text-align: center;
      line-height: 1;
    }

    .brand {
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .maker {
      margin-top: 4px;
      color: #77777d;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .mic-state {
      width: 42px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      visibility: hidden;
    }

    .mic-state.active { visibility: visible; }
    .mic-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px rgba(48, 209, 88, .6);
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      display: grid;
      place-items: center;
      justify-self: end;
    }

    .icon-button:active { background: var(--panel-2); }

    .mode-switch {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid #29292e;
      background: #141416;
      border-radius: 14px;
    }

    .mode-btn {
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .mode-btn.active {
      background: #303035;
      color: var(--text);
    }

    .beginner-panel {
      flex: 0 0 auto;
    }

    .strings {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }

    .string-btn {
      height: 61px;
      min-width: 0;
      padding: 5px 1px;
      border: 1px solid #333338;
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .string-btn .num {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .string-btn .letter {
      margin-top: 3px;
      font-size: 23px;
      font-weight: 850;
      line-height: 1;
    }

    .string-btn .edge {
      height: 11px;
      margin-top: 2px;
      color: var(--muted);
      font-size: 8px;
      white-space: nowrap;
    }

    .string-btn.active {
      border-color: var(--accent);
      background: rgba(10, 132, 255, .15);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .main-card {
      flex: 1 1 auto;
      min-height: 0;
      border: 1px solid #29292e;
      border-radius: 24px;
      background: rgba(25, 25, 28, .92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 18px 14px;
      overflow: hidden;
    }

    .target-line {
      min-height: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .note {
      text-align: center;
      font-size: clamp(68px, 18vh, 112px);
      line-height: .95;
      font-weight: 850;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
    }

    .frequency {
      min-height: 20px;
      margin-top: 4px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .meter {
      position: relative;
      height: 112px;
      margin: 7px 0 0;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .arc {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 5px;
      height: 92px;
      border-top: 2px solid var(--line);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .center-mark {
      position: absolute;
      left: 50%;
      bottom: 13px;
      width: 3px;
      height: 73px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .9);
      transform: translateX(-50%);
    }

    .needle {
      position: absolute;
      left: 50%;
      bottom: 13px;
      width: 4px;
      height: 77px;
      border-radius: 5px;
      background: var(--warn);
      transform-origin: 50% 100%;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 150ms ease-out, background-color 150ms ease;
      box-shadow: 0 0 14px rgba(255, 159, 10, .38);
    }

    .pivot {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 5px #242428;
      transform: translateX(-50%);
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      margin: -1px 7% 0;
      color: #77777d;
      font-size: 10px;
    }

    .result {
      min-height: 60px;
      margin-top: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-main {
      font-size: clamp(24px, 6.2vw, 34px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .result-sub {
      min-height: 18px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .hidden { display: none !important; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(10px);
    }

    .settings-card {
      width: min(100%, 360px);
      border: 1px solid #34343a;
      border-radius: 22px;
      background: #1b1b1e;
      padding: 20px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .5);
    }

    .settings-card h2 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      color: #dddde2;
      font-size: 14px;
    }

    .setting-row input,
    .setting-row select {
      width: 110px;
      border: 1px solid #3a3a40;
      border-radius: 11px;
      background: #101012;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    .setting-row input {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .setting-row + .setting-row {
      margin-top: 12px;
    }

    .done-button {
      width: 100%;
      height: 46px;
      margin-top: 18px;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      font-weight: 800;
    }

    .settings-hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    @media (max-height: 700px) {
      .shell { padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: max(4px, env(safe-area-inset-bottom)); }
      .app { gap: 6px; }
      .topbar { min-height: 34px; }
      .brand { font-size: 15px; }
      .maker { margin-top: 2px; font-size: 8px; }
      .mode-btn { height: 34px; }
      .string-btn { height: 51px; }
      .string-btn .letter { font-size: 20px; }
      .string-btn .edge { display: none; }
      .main-card { border-radius: 20px; padding: 8px 14px 10px; }
      .note { font-size: clamp(58px, 15vh, 86px); }
      .meter { height: 86px; }
      .arc { height: 70px; }
      .center-mark { height: 55px; }
      .needle { height: 59px; }
      .result { min-height: 48px; }
      .result-main { font-size: 24px; }
    }

    @media (display-mode: standalone) {
      .shell {
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }
    }
  
    .start-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 30;
      max-width: calc(100vw - 28px);
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 1px solid #3a3a40;
      border-radius: 999px;
      background: rgba(28, 28, 31, .96);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .start-hint.error {
      border-color: rgba(255, 159, 10, .65);
    }

    /* V11: no raw guesses on the main display. */
    .main-card.unlocked .needle { visibility: hidden; }
    .main-card.held .needle, .main-card.held .note { opacity: .4; }
    .note { min-height: .95em; }
    .topbar { flex: 0 0 auto; }
    .result-sub { max-width: 100%; text-wrap: balance; }
    .settings-card { max-height: calc(100dvh - 36px); overflow-y: auto; overscroll-behavior: contain; }
    .setting-row input, .setting-row select { font-size: 16px; }
    .setting-row select { width: 150px; }
    .version-label { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; }
    .diag-badge { margin-top: 4px; color: var(--warn); font-size: 10px; }
    .diagnostics-panel { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
    .diagnostics-panel summary { cursor: pointer; font-size: 13px; color: var(--muted); }
    .diagnostics-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; }
    .diagnostics-toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
    .diagnostic-buttons { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .diagnostic-buttons button { min-height: 40px; padding: 8px 10px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; cursor: pointer; }
    .diagnostic-buttons button:disabled { opacity: .4; cursor: default; }
    button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .start-hint { z-index: 10; }
    @media (max-width: 350px) { .setting-row { gap: 5px; } .setting-row select { width: 135px; } }
    @media (max-height: 470px) {
      .app { gap: 4px; }
      .main-card { padding: 4px 10px; }
      .note { font-size: 40px; }
      .frequency, .target-line { font-size: 11px; min-height: 14px; }
      .meter { height: 50px; margin-top: 3px; }
      .arc { height: 43px; }
      .center-mark { height: 35px; }
      .needle { height: 37px; }
      .result { min-height: 36px; margin-top: 3px; }
      .result-main { font-size: 18px; }
      .result-sub { font-size: 10px; margin-top: 3px; min-height: 12px; }
      .string-btn { height: 41px; }
      .string-btn .letter { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { .needle { transition: none; } }

</style>
</head>
<body>
  <noscript>This tuner needs JavaScript. / Dieses Stimmgerät benötigt JavaScript.</noscript>

  <div class="shell">
    <main class="app">
      <header class="topbar">
        <div id="micState" class="mic-state">
          <span class="mic-dot"></span><span>MIC</span>
        </div>

        <div class="brand-lockup">
          <div class="brand">GuitarTuner</div>
          <div class="maker">by dw-creative</div>
          <div id="diagBadge" class="diag-badge hidden"></div>
        </div>

        <button id="settingsButton" class="icon-button" type="button">⚙︎</button>
      </header>

      <div id="modeSwitch" class="mode-switch" role="group">
        <button id="normalMode" class="mode-btn active" type="button"></button>
        <button id="beginnerMode" class="mode-btn" type="button"></button>
      </div>

      <section id="beginnerPanel" class="beginner-panel hidden">
        <div class="strings">
          <button class="string-btn active" type="button" data-string="1" data-freq="82.4069" data-note="E2">
            <span class="num">1</span><span class="letter">E</span><span class="edge"></span>
          </button>
          <button class="string-btn" type="button" data-string="2" data-freq="110.0000" data-note="A2">
            <span class="num">2</span><span class="letter">A</span><span class="edge"></span>
          </button>
          <button class="string-btn" type="button" data-string="3" data-freq="146.8324" data-note="D3">
            <span class="num">3</span><span class="letter">D</span><span class="edge"></span>
          </button>
          <button class="string-btn" type="button" data-string="4" data-freq="195.9977" data-note="G3">
            <span class="num">4</span><span class="letter">G</span><span class="edge"></span>
          </button>
          <button class="string-btn" type="button" data-string="5" data-freq="246.9417" data-note="B3">
            <span class="num">5</span><span class="letter" id="fifthStringLetter">B</span><span class="edge"></span>
          </button>
          <button class="string-btn" type="button" data-string="6" data-freq="329.6276" data-note="E4">
            <span class="num">6</span><span class="letter">E</span><span class="edge"></span>
          </button>
        </div>
      </section>

      <section class="main-card unlocked">
        <div id="targetLine" class="target-line"></div>
        <div id="note" class="note">&nbsp;</div>
        <div id="frequency" class="frequency"></div>

        <div id="meter" class="meter">
          <div class="arc"></div>
          <div class="center-mark"></div>
          <div id="needle" class="needle"></div>
          <div class="pivot"></div>
        </div>

        <div class="meter-labels">
          <span id="meterLow"></span>
          <span id="meterCorrect"></span>
          <span id="meterHigh"></span>
        </div>

        <div class="result">
          <div id="resultMain" class="result-main"></div>
          <div id="resultSub" class="result-sub"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="startHint" class="start-hint hidden" role="status" aria-live="polite"></div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-card">
      <h2 id="settingsTitle" tabindex="-1"></h2>
      <div class="setting-row">
        <label id="a4Label" for="a4"></label>
        <div><input id="a4" type="number" min="430" max="450" step="0.1" value="440" inputmode="decimal"> Hz</div>
      </div>

      <div class="setting-row">
        <label id="languageLabel" for="languageSelect"></label>
        <select id="languageSelect">
          <option value="auto"></option>
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>

      <div id="settingsHint" class="settings-hint"></div>
      <details class="diagnostics-panel">
        <summary id="diagSummary"></summary>
        <label class="diagnostics-toggle"><span id="diagLabel"></span><input id="diagToggle" type="checkbox"></label>
        <p id="diagHelp" class="settings-hint"></p>
        <div id="diagCount" class="settings-hint"></div>
        <div class="diagnostic-buttons">
          <button id="diagMark" type="button" disabled></button>
          <button id="diagExport" type="button" disabled></button>
          <button id="diagClear" type="button" disabled></button>
        </div>
      </details>
      <div class="version-label">GuitarTuner 11.0.0</div>
      <button id="doneButton" class="done-button" type="button"></button>
    </div>
  </div>

<script id="guitartuner-dsp">
/* GuitarTuner V11 DSP. No DOM, network, recording, or third-party dependency.
 * YIN CMNDF: de Cheveigne & Kawahara, JASA 111 (2002), doi:10.1121/1.1458024.
 * Spectral scores and thresholds below are application heuristics, not
 * calibrated probabilities. A pure tone cannot reveal a missing fundamental.
 */
const GuitarTunerDSP = (() => {
  'use strict';
  const VERSION = '11.0.0';
  const CONFIG = Object.freeze({
    minHz: 55, maxHz: 1250, windowMs: 96, intervalMs: 60,
    acquireRms: 0.00010, followRms: 0.000035,
    acquireClarity: 0.86, followClarity: 0.78,
    attackMs: 140, clusterCents: 24, nearCents: 65,
    releaseMs: 420, displayHoldMs: 210
  });
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const cents = (a, b) => 1200 * Math.log2(a / b);
  const median = values => {
    const s = values.slice().sort((a, b) => a - b);
    const m = s.length >> 1;
    return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null;
  };
  function gcd(a, b) { while (b) { const r = a % b; a = b; b = r; } return a; }

  class FFT {
    constructor(n) {
      if (!Number.isInteger(n) || n < 2 || (n & (n - 1))) throw new Error('FFT size must be a power of two');
      this.n = n;
      this.re = new Float64Array(n);
      this.im = new Float64Array(n);
      this.mag = new Float64Array(n >> 1);
      this.rev = new Uint32Array(n);
      const bits = Math.log2(n);
      for (let i = 0; i < n; i++) {
        let x = i, r = 0;
        for (let j = 0; j < bits; j++) { r = (r << 1) | (x & 1); x >>= 1; }
        this.rev[i] = r;
      }
      this.cos = new Float64Array(n >> 1);
      this.sin = new Float64Array(n >> 1);
      for (let i = 0; i < n / 2; i++) {
        this.cos[i] = Math.cos(-2 * Math.PI * i / n);
        this.sin[i] = Math.sin(-2 * Math.PI * i / n);
      }
    }
    spectrum(data, window) {
      const { n, re, im, rev, mag } = this;
      re.fill(0); im.fill(0);
      for (let i = 0; i < data.length; i++) re[rev[i]] = data[i] * window[i];
      for (let size = 2; size <= n; size *= 2) {
        const half = size >> 1, step = n / size;
        for (let start = 0; start < n; start += size) {
          for (let j = 0; j < half; j++) {
            const k = j * step, a = start + j, b = a + half;
            const tr = this.cos[k] * re[b] - this.sin[k] * im[b];
            const ti = this.cos[k] * im[b] + this.sin[k] * re[b];
            re[b] = re[a] - tr; im[b] = im[a] - ti;
            re[a] += tr; im[a] += ti;
          }
        }
      }
      for (let i = 0; i < mag.length; i++) mag[i] = Math.hypot(re[i], im[i]);
      return mag;
    }
  }

  class Detector {
    constructor(sampleRate) {
      if (!(sampleRate >= 8000 && sampleRate <= 192000)) throw new Error('Unsupported sample rate');
      this.sampleRate = sampleRate;
      // The live audio graph supplies two low-pass biquads before decimation.
      // Box averaging adds attenuation but is not a substitute for that filter.
      this.stride = Math.max(1, Math.floor(sampleRate / 12000));
      this.rate = sampleRate / this.stride;
      this.length = Math.round(this.rate * CONFIG.windowMs / 1000);
      this.requiredSamples = this.length * this.stride;
      this.data = new Float64Array(this.length);
      this.maxTau = Math.ceil(this.rate / CONFIG.minHz) + 1;
      this.minTau = Math.max(2, Math.floor(this.rate / CONFIG.maxHz) - 1);
      this.diff = new Float64Array(this.maxTau + 1);
      this.cmnd = new Float64Array(this.maxTau + 1);
      this.window = new Float64Array(this.length);
      for (let i = 0; i < this.length; i++) this.window[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (this.length - 1));
      const nFFT = 2 ** Math.ceil(Math.log2(this.length * 2));
      this.fft = new FFT(nFFT);
    }
    analyze(input) {
      if (input.length < this.requiredSamples) throw new Error('Audio buffer is too short');
      const n = this.length, start = input.length - this.requiredSamples, x = this.data;
      let mean = 0, peak = 0;
      for (let i = 0; i < n; i++) {
        let v = 0;
        for (let k = 0; k < this.stride; k++) {
          const a = input[start + i * this.stride + k];
          if (!Number.isFinite(a)) return { hz: null, rms: 0, recentRms: 0, clarity: 0, coverage: 0, reason: 'nonfinite' };
          v += a; peak = Math.max(peak, Math.abs(a));
        }
        x[i] = v / this.stride; mean += x[i];
      }
      mean /= n;
      let energy = 0, recent = 0;
      const shortN = Math.round(this.rate * 0.012);
      for (let i = 0; i < n; i++) {
        x[i] -= mean; energy += x[i] * x[i];
        if (i >= n - shortN) recent += x[i] * x[i];
      }
      const rms = Math.sqrt(energy / n), recentRms = Math.sqrt(recent / shortN);
      const empty = { hz: null, yinHz: null, clarity: 0, coverage: 0, rms, recentRms, peak, corrected: false, reason: 'quiet' };
      if (rms < CONFIG.followRms * 0.65) return empty;
      // Level normalization changes numerical scale, not signal-to-noise ratio.
      const norm = 1 / rms;
      for (let i = 0; i < n; i++) x[i] *= norm;
      const usable = n - this.maxTau, d = this.diff, y = this.cmnd;
      let sumDiff = 0;
      y[0] = 1;
      for (let tau = 1; tau <= this.maxTau; tau++) {
        let sum = 0;
        for (let i = 0; i < usable; i++) {
          const delta = x[i] - x[i + tau]; sum += delta * delta;
        }
        d[tau] = sum; sumDiff += sum;
        y[tau] = sumDiff > 1e-12 ? sum * tau / sumDiff : 1;
      }
      const candidates = [];
      for (let tau = this.minTau; tau < this.maxTau; tau++) {
        if (y[tau] >= y[tau - 1] || y[tau] > y[tau + 1] || y[tau] > 0.30) continue;
        // Interpolate the unnormalised difference minimum for pitch precision;
        // evaluate periodicity using the normalised difference function.
        const denom = d[tau - 1] - 2 * d[tau] + d[tau + 1];
        const offset = Math.abs(denom) > 1e-10 ? clamp(0.5 * (d[tau - 1] - d[tau + 1]) / denom, -0.5, 0.5) : 0;
        const hz = this.rate / (tau + offset);
        if (hz < CONFIG.minHz || hz > CONFIG.maxHz) continue;
        const clarity = clamp(1 - y[tau], 0, 1);
        candidates.push({ hz, clarity, tau, coverage: 0 });
      }
      if (!candidates.length) return { ...empty, reason: 'aperiodic' };
      const first = candidates.find(c => c.clarity >= 0.84) || candidates.reduce((a, b) => b.clarity > a.clarity ? b : a);
      const peaks = this.spectralPeaks();
      for (const c of candidates) {
        const s = this.scoreSpectrum(c.hz, peaks);
        c.coverage = s.coverage;
        c.score = 0.50 * c.clarity + 0.46 * s.coverage + 0.04 * s.fundamental - s.subharmonicPenalty;
      }
      // In a tie prefer the shorter actual period, not an arbitrary sub-octave.
      candidates.sort((a, b) => b.score - a.score || b.hz - a.hz);
      const best = candidates[0];
      if (best.clarity < 0.74 || best.coverage < 0.50) {
        return { ...empty, yinHz: first.hz, clarity: best.clarity, coverage: best.coverage, reason: 'unclear' };
      }
      return {
        hz: best.hz, yinHz: first.hz, clarity: best.clarity, coverage: best.coverage,
        rms, recentRms, peak, corrected: Math.abs(cents(best.hz, first.hz)) > 80,
        reason: 'periodic', candidateCount: candidates.length
      };
    }
    spectralPeaks() {
      const mag = this.fft.spectrum(this.data, this.window), bin = this.rate / this.fft.n;
      const low = Math.max(2, Math.floor(40 / bin));
      const high = Math.min(mag.length - 2, Math.ceil(4300 / bin));
      let max = 0;
      const floorSamples = [];
      for (let i = low; i <= high; i++) { max = Math.max(max, mag[i]); if (i % 5 === 0) floorSamples.push(mag[i]); }
      const floor = median(floorSamples) || 0;
      const threshold = Math.max(max * 0.012, floor * 5);
      const peaks = [];
      for (let i = low; i <= high; i++) {
        if (mag[i] < threshold || mag[i] <= mag[i - 1] || mag[i] < mag[i + 1]) continue;
        const a = Math.log(Math.max(mag[i - 1], 1e-20));
        const b = Math.log(Math.max(mag[i], 1e-20));
        const c = Math.log(Math.max(mag[i + 1], 1e-20));
        const denom = a - 2 * b + c;
        const offset = Math.abs(denom) > 1e-9 ? clamp(0.5 * (a - c) / denom, -0.5, 0.5) : 0;
        peaks.push({ hz: (i + offset) * bin, weight: Math.pow(mag[i] / Math.max(max, 1e-20), 0.6) });
      }
      return peaks.sort((a, b) => b.weight - a.weight).slice(0, 24);
    }
    scoreSpectrum(f, peaks) {
      let total = 0, explained = 0, fundamental = 0, divisor = 0;
      for (const p of peaks) {
        total += p.weight;
        const h = Math.round(p.hz / f);
        if (h < 1 || h > 16) continue;
        const tolerance = Math.max(3.5, p.hz * 0.011);
        if (Math.abs(p.hz - h * f) > tolerance) continue;
        explained += p.weight;
        divisor = gcd(divisor, h);
        if (h === 1) fundamental = Math.max(fundamental, p.weight);
      }
      // If only every second/third predicted harmonic exists, the lower
      // fundamental is unproven. Never divide simply to fit the selected string.
      return { coverage: total ? explained / total : 0, fundamental, subharmonicPenalty: divisor > 1 ? 0.20 : 0 };
    }
  }

  class Tracker {
    constructor() { this.reset(); }
    reset() {
      this.state = 'IDLE'; this.locked = null; this.lastGood = -Infinity;
      this.attackUntil = -Infinity; this.lastOnset = -Infinity;
      this.prevRms = 0; this.queue = []; this.near = []; this.lastTime = -Infinity;
    }
    cluster(queue, required, span) {
      const good = queue.filter(v => v && Number.isFinite(v.hz));
      if (good.length < required) return null;
      const anchor = good[good.length - 1].hz;
      const close = good.filter(v => Math.abs(cents(v.hz, anchor)) <= CONFIG.clusterCents);
      if (close.length < required || close[close.length - 1].time - close[0].time < span) return null;
      const log = median(close.map(v => Math.log2(v.hz)));
      return 2 ** log;
    }
    update(frame, timeMs) {
      if (!Number.isFinite(timeMs)) throw new Error('Tracker needs a monotonic timestamp');
      if (timeMs - this.lastTime > 1000 || timeMs < this.lastTime) this.reset();
      const dt = Math.max(1, timeMs - this.lastTime); this.lastTime = timeMs;
      const f = frame.hz;
      const level = frame.recentRms || 0;
      const newAttack = level > Math.max(CONFIG.acquireRms * 2.5, this.prevRms * 3.2)
        && timeMs - this.lastOnset > 300;
      this.prevRms = level;
      if (newAttack) {
        this.lastOnset = timeMs; this.attackUntil = timeMs + CONFIG.attackMs;
        this.locked = null; this.queue = []; this.near = []; this.state = 'ATTACK';
      }
      const hadLock = this.locked !== null;
      const gate = hadLock ? CONFIG.followRms : CONFIG.acquireRms;
      const quality = hadLock ? CONFIG.followClarity : CONFIG.acquireClarity;
      const valid = f && frame.rms >= gate && frame.clarity >= quality && frame.coverage >= 0.50;
      if (timeMs < this.attackUntil) return { hz: null, state: 'ATTACK', held: false };
      if (!valid) {
        this.queue.push(null); if (this.queue.length > 5) this.queue.shift();
        this.near = [];
        if (hadLock && timeMs - this.lastGood <= CONFIG.releaseMs) {
          this.state = 'HOLD';
          return { hz: timeMs - this.lastGood <= CONFIG.displayHoldMs ? this.locked : null, state: 'HOLD', held: true };
        }
        this.locked = null;
        this.state = frame.rms >= CONFIG.acquireRms ? 'ACQUIRE' : 'IDLE';
        return { hz: null, state: this.state, held: false };
      }
      if (!hadLock) {
        this.queue.push({ hz: f, time: timeMs }); if (this.queue.length > 5) this.queue.shift();
        const acquired = this.cluster(this.queue, 4, 150);
        if (!acquired) { this.state = 'ACQUIRE'; return { hz: null, state: this.state, held: false }; }
        this.locked = acquired; this.lastGood = timeMs; this.near = [Math.log2(acquired)]; this.queue = [];
        this.state = 'LOCKED'; return { hz: this.locked, state: this.state, held: false };
      }
      if (Math.abs(cents(f, this.locked)) <= CONFIG.nearCents) {
        this.queue = [];
        this.near.push(Math.log2(f)); if (this.near.length > 3) this.near.shift();
        const target = median(this.near), old = Math.log2(this.locked);
        const alpha = 1 - Math.exp(-Math.min(dt, 120) / 95);
        this.locked = 2 ** (old + alpha * (target - old)); this.lastGood = timeMs;
        this.state = 'LOCKED'; return { hz: this.locked, state: this.state, held: false };
      }
      this.queue.push({ hz: f, time: timeMs }); if (this.queue.length > 5) this.queue.shift();
      const ratio = Math.max(f / this.locked, this.locked / f);
      const harmonicJump = [2, 3, 4].some(h => Math.abs(cents(ratio, h)) < 40);
      const replacement = this.cluster(this.queue, harmonicJump ? 5 : 4, harmonicJump ? 230 : 150);
      if (replacement) {
        // Crucial: a confirmed new note replaces the old one immediately.
        // Never average unrelated notes into fictitious intermediate pitches.
        this.locked = replacement; this.lastGood = timeMs; this.near = [Math.log2(replacement)]; this.queue = [];
        this.state = 'LOCKED'; return { hz: this.locked, state: this.state, held: false, switched: true };
      }
      this.state = 'CHANGE';
      return { hz: null, state: this.state, held: false };
    }
  }
  return Object.freeze({ VERSION, CONFIG, Detector, Tracker, FFT, cents });
})();

    } else {
      const midi=69+12*Math.log2(freq/getA4());
      // Note-label hysteresis avoids C/C-sharp flicker at a half-semitone boundary.
      if(displayMidi===null || Math.abs((midi-displayMidi)*100)>57) {
        displayMidi=Math.round(midi); tuneActive=false;
      }
      cents=(midi-displayMidi)*100;
      noteEl.textContent=noteNames()[((displayMidi%12)+12)%12]+(Math.floor(displayMidi/12)-1);
      frequencyEl.textContent=`${fmt1(freq)} Hz`;
      tuneActive=Math.abs(cents)<=(tuneActive?7:4);
      resultMain.textContent=t(tuneActive?'fits':cents<0?'tooLow':'tooHigh');
      resultSub.textContent=t(tuneActive?'toneInTune':cents<0?'centsBelow':'centsAbove',{cents:Math.round(Math.abs(cents))});
    }
    setNeedle(cents,tuneActive);
  }
  function renderTracked(result) {
    if(!result.hz) { showWaiting(result.state); return; }
    updateDisplay(result.hz);
    if(result.held) {
      card.classList.add('held'); tuneActive=false;
      resultMain.textContent=t('held'); resultSub.textContent=t('pluckSingle');
      needleEl.style.background='var(--muted)'; needleEl.style.boxShadow='none';
    }
  }
  function chooseString(button) {
    targetString=Number(button.dataset.string); storage.set('guitartuner-string',String(targetString));
    for(const b of stringButtons) { const selected=b===button; b.classList.toggle('active',selected); b.setAttribute('aria-pressed',String(selected)); }
    updateTargetLine(); resetReading();
  }
  function setMode(nextMode) {
    mode=nextMode==='beginner'?'beginner':'normal'; storage.set('guitartuner-mode',mode);
    const beginner=mode==='beginner';
    normalModeBtn.classList.toggle('active',!beginner); beginnerModeBtn.classList.toggle('active',beginner);
    normalModeBtn.setAttribute('aria-pressed',String(!beginner)); beginnerModeBtn.setAttribute('aria-pressed',String(beginner));
    beginnerPanel.classList.toggle('hidden',!beginner); chooseString(currentStringButton());
  }

  function showStartHint(key,error=false) {
    hintKey=key; hintError=error; startHint.textContent=t(key);
    startHint.classList.remove('hidden'); startHint.classList.toggle('error',error);
  }
  function hideStartHint() { hintKey=null; startHint.classList.add('hidden'); }
  function liveTrack() { return stream?.getAudioTracks().find(track=>track.readyState==='live'); }
  function syncAudioState() {
    const track=liveTrack();
    const ready=pageActive && !document.hidden && audioContext?.state==='running' && analyser && track && !track.muted;
    micState.classList.toggle('active',Boolean(ready));
    if(ready) {
      if(!running) {
        running=true; lastAnalysis=-Infinity; lastAudioTime=-1; resetReading();
        if(animationId===null)animationId=requestAnimationFrame(tick);
      }
      hideStartHint();
    } else {
      if(running) { running=false; if(animationId!==null)cancelAnimationFrame(animationId); animationId=null; resetReading(); }
      if(pageActive && !document.hidden && track && !requestPending)showStartHint('tapResume');
    }
  }
  function ensureAudioContext() {
    if(audioContext && audioContext.state!=='closed')return audioContext;
    const Constructor=window.AudioContext || window.webkitAudioContext;
    if(!Constructor)throw Object.assign(new Error('Web Audio unavailable'),{name:'NotSupportedError'});
    audioContext=new Constructor({latencyHint:'interactive'});
    audioContext.addEventListener('statechange',syncAudioState);
    return audioContext;
  }
  function kickResume() {
    if(!audioContext || audioContext.state==='closed')return;
    // Never await resume as a startup gate. Browsers can leave its Promise
    // pending until the NEXT gesture. Gestures must still be able to call it.
    if(audioContext.state!=='running') {
      try { audioContext.resume().then(syncAudioState).catch(()=>showStartHint('tapResume')); }
      catch (_) { showStartHint('tapResume'); }
    }
    syncAudioState();
  }
  function disconnectGraph() {
    for(const n of audioNodes)try{n.disconnect();}catch(_){}
    audioNodes=[]; analyser=null; source=null; buffer=null; detector=null;
  }
  function buildGraph() {
    if(analyser || !liveTrack())return;
    const context=ensureAudioContext();
    source=context.createMediaStreamSource(stream);
    const hp=context.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=40; hp.Q.value=0.707;
    const cutoff=Math.min(2800,context.sampleRate*.32);
    const lp1=context.createBiquadFilter(); lp1.type='lowpass'; lp1.frequency.value=cutoff; lp1.Q.value=0.5412;
    const lp2=context.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=cutoff; lp2.Q.value=1.3066;
    detector=new GuitarTunerDSP.Detector(context.sampleRate);
    analyser=context.createAnalyser();
    analyser.fftSize=2**Math.ceil(Math.log2(Math.max(8192,detector.requiredSamples)));
    analyser.smoothingTimeConstant=0;
    // A zero-gain destination makes graph rendering explicit, without playing
    // microphone audio through speakers (no acoustic feedback).
    const silent=context.createGain(); silent.gain.value=0;
    source.connect(hp); hp.connect(lp1); lp1.connect(lp2); lp2.connect(analyser);
    analyser.connect(silent); silent.connect(context.destination);
    audioNodes=[source,hp,lp1,lp2,analyser,silent]; buffer=new Float32Array(analyser.fftSize);
    for(const track of stream.getAudioTracks()) {
      track.addEventListener('ended',()=>{disconnectGraph();syncAudioState();if(pageActive)showStartHint('micEnded',true);});
      track.addEventListener('mute',syncAudioState); track.addEventListener('unmute',()=>{kickResume();syncAudioState();});
    }
  }
  function microphoneError(error) {
    console.warn('GuitarTuner microphone:',error);
    const key=['NotAllowedError','PermissionDeniedError','SecurityError'].includes(error.name)?'allowRetry':
      ['NotFoundError','DevicesNotFoundError'].includes(error.name)?'noMic':
      ['NotReadableError','TrackStartError'].includes(error.name)?'micBusy':
      error.name==='NotSupportedError'?'micUnsupported':'micFailed';
    showStartHint(key,true);
  }
  function requestMicrophone() {
    if(!pageActive)return;
    if(!window.isSecureContext){showStartHint('micHttps',true);return;}
    if(!navigator.mediaDevices?.getUserMedia){showStartHint('micUnsupported',true);return;}
    try { ensureAudioContext(); kickResume(); } catch(error) { microphoneError(error); return; }
    if(liveTrack()) {try{buildGraph();kickResume();}catch(error){microphoneError(error);}return;}
    // Mutex applies only to getUserMedia, never to user activation/resume.
    if(requestPending)return;
    const generation=requestGeneration;
    showStartHint('micWaiting');
    requestPending=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1},video:false});
    requestPending.then(acquired=>{
      if(generation!==requestGeneration || !pageActive){acquired.getTracks().forEach(track=>track.stop());return;}
      stream=acquired; buildGraph();
      if(audioContext.state!=='running')showStartHint('tapStart');
      kickResume();
    }).catch(error=>{if(generation===requestGeneration && pageActive)microphoneError(error);})
      .finally(()=>{if(generation===requestGeneration){requestPending=null;syncAudioState();}});
  }
  function gestureStart(event) {
    if(event.type==='keydown' && (event.repeat || ['Tab','Shift','Control','Alt','Meta','Escape'].includes(event.key)))return;
    // Executes synchronously INSIDE the trusted event, even with a permission
    // request or an old resume() Promise pending. No overlay and no preventDefault.
    if(!running)requestMicrophone();
  }
  function releaseMicrophone() {
    requestGeneration++; requestPending=null;
    running=false; if(animationId!==null)cancelAnimationFrame(animationId); animationId=null;
    disconnectGraph();
    if(stream)stream.getTracks().forEach(track=>track.stop()); stream=null;
    if(audioContext){try{audioContext.close().catch(()=>{});}catch(_){} audioContext=null;}
    micState.classList.remove('active');
  }
  function tick(now) {
    animationId=null;
    if(!running || !analyser || !detector)return;
    try {
      if(now-lastAnalysis>=GuitarTunerDSP.CONFIG.intervalMs && audioContext.currentTime-lastAudioTime>=.03) {
        lastAnalysis=now; lastAudioTime=audioContext.currentTime;
        const before=performance.now();
        analyser.getFloatTimeDomainData(buffer);
        const frame=detector.analyze(buffer), tracked=tracker.update(frame,now);
        renderTracked(tracked);
        if(diagnosticsEnabled)appendDiagnostic(frame,tracked,now,performance.now()-before);
      }
    } catch(error) {
      console.error('GuitarTuner analysis:',error); running=false; micState.classList.remove('active');
      showStartHint('internalError',true); return;
    }
    animationId=requestAnimationFrame(tick);
  }

  function resetDiagnostics() {
    diagnosticRows=[]; diagPosition=0; markerCount=0; nextMarker=0;
    diagStarted=performance.now(); diagStartedISO=new Date().toISOString(); refreshDiagnostics();
  }
  function appendDiagnostic(frame,tracked,now,cost) {
    const row={
      timeMs:Math.round(now-diagStarted), audioTimeMs:Math.round(audioContext.currentTime*1000),
      rms:frame.rms, recentRms:frame.recentRms, peak:frame.peak,
      yinHz:frame.yinHz, candidateHz:frame.hz, clarity:frame.clarity, harmonicCoverage:frame.coverage,
      corrected:frame.corrected, reason:frame.reason, state:tracked.state, displayedHz:tracked.hz,
      displayedNote:noteEl.textContent.trim(), mode, targetHz:mode==='beginner'?targetFreq:null,
      targetString:mode==='beginner'?targetString:null, referenceA4:getA4(), computeMs:Number(cost.toFixed(3)),
      marker:nextMarker||null
    };
    nextMarker=0;
    if(diagnosticRows.length<MAX_DIAGNOSTICS)diagnosticRows.push(row);
    else{diagnosticRows[diagPosition]=row;diagPosition=(diagPosition+1)%MAX_DIAGNOSTICS;}
    if(!settingsModal.classList.contains('hidden'))refreshDiagnostics();
  }
  function refreshDiagnostics() {
    $('diagCount').textContent=t('diagCount',{n:diagnosticRows.length,marks:markerCount});
    $('diagExport').disabled=!diagnosticRows.length;
    $('diagClear').disabled=!diagnosticRows.length;
    $('diagMark').disabled=!diagnosticsEnabled;
    $('diagBadge').classList.toggle('hidden',!diagnosticsEnabled);
    $('diagToggle').checked=diagnosticsEnabled;
  }
  async function exportDiagnostics() {
    if(!diagnosticRows.length)return;
    const rows=diagPosition?diagnosticRows.slice(diagPosition).concat(diagnosticRows.slice(0,diagPosition)):diagnosticRows.slice();
    const settings=liveTrack()?.getSettings?.() || {};
    const audioSettings={};
    // Whitelist: no deviceId, groupId, labels, audio samples or browsing history.
    for(const key of ['sampleRate','channelCount','echoCancellation','noiseSuppression','autoGainControl','latency'])if(key in settings)audioSettings[key]=settings[key];
    const payload={schemaVersion:1,appVersion:GuitarTunerDSP.VERSION,startedAt:diagStartedISO,exportedAt:new Date().toISOString(),
      sampleRate:audioContext?.sampleRate||null,analysisSampleRate:detector?.rate||null,
      userAgent:navigator.userAgent,language,config:GuitarTunerDSP.CONFIG,audioSettings,
      note:'Local diagnostic measurements only. No audio samples. Clarity and harmonic coverage are heuristic scores, not probabilities.',rows};
    const text=JSON.stringify(payload,null,2),name=`guitartuner-v11-diagnose-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
    const file=new File([text],name,{type:'application/json'});
    // On mobile a share sheet is convenient, desktop uses a normal download.
    if(navigator.canShare && navigator.share && navigator.maxTouchPoints>0) {
      try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'GuitarTuner diagnostics'});return;}}
      catch(error){if(error.name==='AbortError')return;}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
  function openSettings() {
    settingsModal.classList.remove('hidden');a4Input.value=String(referenceA4);refreshDiagnostics();$('settingsTitle').focus();
  }
  function closeSettings() {
    const parsed=Number(a4Input.value);
    if(Number.isFinite(parsed)&&parsed>=430&&parsed<=450)referenceA4=parsed;
    a4Input.value=String(referenceA4);storage.set('guitartuner-a4',String(referenceA4));
    settingsModal.classList.add('hidden');updateTargetLine();resetReading();$('settingsButton').focus();
  }
  for(const event of ['pointerup','touchend','click','keydown'])document.addEventListener(event,gestureStart,{passive:true});
  normalModeBtn.addEventListener('click',()=>setMode('normal'));
  beginnerModeBtn.addEventListener('click',()=>setMode('beginner'));
  stringButtons.forEach(b=>b.addEventListener('click',()=>chooseString(b)));
  $('settingsButton').addEventListener('click',openSettings);$('doneButton').addEventListener('click',closeSettings);
  languageSelect.addEventListener('change',()=>applyLanguagePreference(languageSelect.value));
  window.addEventListener('languagechange',()=>{if(languagePreference==='auto')applyLanguagePreference('auto');});
  settingsModal.addEventListener('click',event=>{if(event.target===settingsModal)closeSettings();});
  settingsModal.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();closeSettings();}
    if(event.key==='Tab'){
      const focusables=[...settingsModal.querySelectorAll('button:not(:disabled), input, select, summary')].filter(el=>el.getClientRects().length);
      const first=focusables[0],last=focusables[focusables.length-1];
      if(event.shiftKey && (document.activeElement===first || document.activeElement===$('settingsTitle'))){event.preventDefault();last.focus();}
      else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  $('diagToggle').addEventListener('change',()=>{diagnosticsEnabled=$('diagToggle').checked;if(diagnosticsEnabled)resetDiagnostics();refreshDiagnostics();});
  $('diagMark').addEventListener('click',()=>{nextMarker=++markerCount;refreshDiagnostics();});
  $('diagClear').addEventListener('click',resetDiagnostics);
  $('diagExport').addEventListener('click',()=>exportDiagnostics().catch(error=>console.error('Diagnostic export:',error)));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)syncAudioState();else{requestMicrophone();syncAudioState();}});
  window.addEventListener('pagehide',()=>{pageActive=false;releaseMicrophone();});
  window.addEventListener('pageshow',event=>{pageActive=true;if(event.persisted)requestMicrophone();});
  applyStaticTranslations();setMode(mode);requestMicrophone();
})();

</script>
</body>
</html>
