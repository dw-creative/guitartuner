<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Stimmgerät</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --panel: #1c1c1e;
      --text: #f5f5f7;
      --muted: #9b9ba0;
      --ok: #34c759;
      --warn: #ff9f0a;
      --accent: #0a84ff;
      --line: #3a3a3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #242428 0, var(--bg) 45%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top))
               max(18px, env(safe-area-inset-right))
               max(22px, env(safe-area-inset-bottom))
               max(18px, env(safe-area-inset-left));
    }

    .app {
      width: min(100%, 520px);
      background: rgba(28, 28, 30, 0.92);
      border: 1px solid #303034;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 26px;
    }

    .note {
      text-align: center;
      font-size: clamp(78px, 24vw, 120px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -0.06em;
      margin-right: .06em;
      font-variant-numeric: tabular-nums;
    }

    .frequency {
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }

    .meter {
      position: relative;
      height: 145px;
      margin: 24px 0 6px;
      overflow: hidden;
    }

    .arc {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 8px;
      height: 115px;
      border-top: 2px solid var(--line);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .center-mark {
      position: absolute;
      left: 50%;
      bottom: 17px;
      width: 3px;
      height: 90px;
      background: rgba(255,255,255,.9);
      border-radius: 2px;
      transform: translateX(-50%);
    }

    .needle {
      position: absolute;
      left: 50%;
      bottom: 17px;
      width: 4px;
      height: 94px;
      border-radius: 5px;
      background: var(--warn);
      transform-origin: 50% 100%;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 90ms linear, background-color 120ms ease;
      box-shadow: 0 0 16px rgba(255,159,10,.4);
    }

    .dot {
      position: absolute;
      left: 50%;
      bottom: 11px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #fff;
      box-shadow: 0 0 0 5px #222;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin: -2px 6% 0;
    }

    .cents {
      text-align: center;
      min-height: 28px;
      margin-top: 12px;
      font-size: 22px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      min-height: 38px;
      margin: 10px 0 18px;
      line-height: 1.35;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.99); }

    .settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    input {
      width: 70px;
      border: 1px solid #3a3a3c;
      background: #111113;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 9px;
      text-align: center;
      font: inherit;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      margin-top: 16px;
      color: #77777c;
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
    }

    @media (prefers-reduced-motion: reduce) {
      .needle { transition: none; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Stimmgerät</h1>
    <div class="subtitle">Chromatisch · Mikrofon</div>

    <div id="note" class="note">—</div>
    <div id="frequency" class="frequency">Mikrofon noch nicht aktiv</div>

    <div class="meter" aria-label="Stimmungsanzeige">
      <div class="arc"></div>
      <div class="center-mark"></div>
      <div id="needle" class="needle"></div>
      <div class="dot"></div>
    </div>

    <div class="scale"><span>−50</span><span>0</span><span>+50 Cent</span></div>
    <div id="cents" class="cents">—</div>
    <div id="status" class="status">Tippe auf „Mikrofon starten“ und erlaube den Mikrofonzugriff.</div>

    <button id="toggle">Mikrofon starten</button>

    <div class="settings">
      <label for="a4">Referenz A4</label>
      <input id="a4" type="number" min="430" max="450" step="0.1" value="440" inputmode="decimal">
      <span>Hz</span>
    </div>

    <div class="hint">
      Funktioniert in Safari auf dem iPhone über HTTPS, z. B. mit GitHub Pages.
    </div>
  </main>

<script>
(() => {
  const noteEl = document.getElementById("note");
  const frequencyEl = document.getElementById("frequency");
  const centsEl = document.getElementById("cents");
  const statusEl = document.getElementById("status");
  const toggleBtn = document.getElementById("toggle");
  const needleEl = document.getElementById("needle");
  const a4Input = document.getElementById("a4");

  const noteNames = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

  let audioContext = null;
  let analyser = null;
  let source = null;
  let stream = null;
  let buffer = null;
  let animationId = null;
  let running = false;
  let smoothedPitch = null;
  let lastGoodAt = 0;

  function getA4() {
    const value = parseFloat(a4Input.value);
    return Number.isFinite(value) && value >= 400 && value <= 480 ? value : 440;
  }

  function frequencyToMidi(freq, a4) {
    return 69 + 12 * Math.log2(freq / a4);
  }

  function updateDisplay(freq) {
    const a4 = getA4();
    const midi = frequencyToMidi(freq, a4);
    const nearestMidi = Math.round(midi);
    const cents = Math.round((midi - nearestMidi) * 100);
    const noteIndex = ((nearestMidi % 12) + 12) % 12;
    const octave = Math.floor(nearestMidi / 12) - 1;

    noteEl.textContent = noteNames[noteIndex] + octave;
    frequencyEl.textContent = freq.toFixed(1) + " Hz";
    centsEl.textContent = (cents > 0 ? "+" : "") + cents + " Cent";

    const limited = Math.max(-50, Math.min(50, cents));
    const angle = limited * 0.9; // ±45°
    needleEl.style.transform = `translateX(-50%) rotate(${angle}deg)`;

    const inTune = Math.abs(cents) <= 4;
    needleEl.style.background = inTune ? "var(--ok)" : "var(--warn)";
    needleEl.style.boxShadow = inTune
      ? "0 0 16px rgba(52,199,89,.55)"
      : "0 0 16px rgba(255,159,10,.4)";
    statusEl.textContent = inTune
      ? "Passt."
      : (cents < 0 ? "Zu tief – etwas höher stimmen." : "Zu hoch – etwas tiefer stimmen.");
  }

  function clearPitchDisplay(message = "Spiele einen möglichst klaren Einzelton.") {
    noteEl.textContent = "—";
    frequencyEl.textContent = "Kein stabiler Ton erkannt";
    centsEl.textContent = "—";
    needleEl.style.transform = "translateX(-50%) rotate(0deg)";
    needleEl.style.background = "var(--warn)";
    statusEl.textContent = message;
    smoothedPitch = null;
  }

  // YIN pitch detection, simplified for a small real-time browser tuner.
  function yinPitchDetector(data, sampleRate) {
    const threshold = 0.12;
    const probabilityThreshold = 0.85;
    const minFreq = 55;   // A1
    const maxFreq = 1500; // well above guitar/voice range

    const minTau = Math.max(2, Math.floor(sampleRate / maxFreq));
    const maxTau = Math.min(Math.floor(sampleRate / minFreq), Math.floor(data.length / 2));

    // Reject very quiet input.
    let rms = 0;
    for (let i = 0; i < data.length; i++) rms += data[i] * data[i];
    rms = Math.sqrt(rms / data.length);
    if (rms < 0.012) return null;

    const yin = new Float32Array(maxTau + 1);

    for (let tau = 1; tau <= maxTau; tau++) {
      let sum = 0;
      for (let i = 0; i < maxTau; i++) {
        const delta = data[i] - data[i + tau];
        sum += delta * delta;
      }
      yin[tau] = sum;
    }

    yin[0] = 1;
    let runningSum = 0;
    for (let tau = 1; tau <= maxTau; tau++) {
      runningSum += yin[tau];
      yin[tau] = runningSum === 0 ? 1 : yin[tau] * tau / runningSum;
    }

    let tauEstimate = -1;
    for (let tau = minTau; tau <= maxTau; tau++) {
      if (yin[tau] < threshold) {
        while (tau + 1 <= maxTau && yin[tau + 1] < yin[tau]) tau++;
        tauEstimate = tau;
        break;
      }
    }

    if (tauEstimate === -1) {
      // Fall back to the best minimum if it is convincing enough.
      let bestTau = minTau;
      for (let tau = minTau + 1; tau <= maxTau; tau++) {
        if (yin[tau] < yin[bestTau]) bestTau = tau;
      }
      if (1 - yin[bestTau] < probabilityThreshold) return null;
      tauEstimate = bestTau;
    }

    // Parabolic interpolation for sub-sample precision.
    const x0 = tauEstimate > 1 ? tauEstimate - 1 : tauEstimate;
    const x2 = tauEstimate + 1 <= maxTau ? tauEstimate + 1 : tauEstimate;
    let betterTau = tauEstimate;

    if (x0 !== tauEstimate && x2 !== tauEstimate) {
      const s0 = yin[x0];
      const s1 = yin[tauEstimate];
      const s2 = yin[x2];
      const denom = 2 * (2 * s1 - s2 - s0);
      if (Math.abs(denom) > 1e-9) {
        betterTau = tauEstimate + (s2 - s0) / denom;
      }
    }

    const freq = sampleRate / betterTau;
    if (!Number.isFinite(freq) || freq < minFreq || freq > maxFreq) return null;
    return freq;
  }

  function tick() {
    if (!running || !analyser) return;

    analyser.getFloatTimeDomainData(buffer);
    const detected = yinPitchDetector(buffer, audioContext.sampleRate);

    if (detected) {
      // Mild smoothing prevents a nervous needle without making it feel slow.
      smoothedPitch = smoothedPitch == null
        ? detected
        : smoothedPitch * 0.72 + detected * 0.28;

      lastGoodAt = performance.now();
      updateDisplay(smoothedPitch);
    } else if (performance.now() - lastGoodAt > 500) {
      clearPitchDisplay();
    }

    animationId = requestAnimationFrame(tick);
  }

  async function start() {
    if (!navigator.mediaDevices?.getUserMedia) {
      statusEl.textContent = "Dieser Browser unterstützt keinen Mikrofonzugriff.";
      return;
    }

    try {
      statusEl.textContent = "Mikrofon wird gestartet …";

      // Creating/resuming AudioContext inside the button tap is important on iPhone.
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;

      source.connect(analyser);
      buffer = new Float32Array(analyser.fftSize);

      running = true;
      toggleBtn.textContent = "Mikrofon stoppen";
      statusEl.textContent = "Spiele einen möglichst klaren Einzelton.";
      lastGoodAt = performance.now();
      tick();
    } catch (err) {
      console.error(err);
      running = false;
      statusEl.textContent =
        "Mikrofon konnte nicht gestartet werden. Prüfe die Safari-Mikrofonfreigabe für diese Website.";
      toggleBtn.textContent = "Mikrofon starten";
    }
  }

  function stop() {
    running = false;
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;

    if (source) {
      try { source.disconnect(); } catch (_) {}
      source = null;
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    analyser = null;
    buffer = null;
    clearPitchDisplay("Mikrofon gestoppt.");
    frequencyEl.textContent = "Mikrofon nicht aktiv";
    toggleBtn.textContent = "Mikrofon starten";
  }

  toggleBtn.addEventListener("click", () => {
    if (running) stop();
    else start();
  });

  document.addEventListener("visibilitychange", () => {
    // iOS may suspend audio when Safari goes into the background.
    if (!document.hidden && running && audioContext?.state === "suspended") {
      audioContext.resume().catch(() => {});
    }
  });
})();
</script>
</body>
</html>
